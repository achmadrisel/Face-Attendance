[project]
name = "face-attendance"
version = "0.1.0"
description = "Face-recognition attendance API with webcam tracking and PostgreSQL storage."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.18.4",
    "boxmot==19.0.0",
    "fastapi==0.136.3",
    "insightface==1.0.1",
    "numpy==2.4.4",
    "onnx==1.21.0",
    "onnxruntime-openvino==1.24.1",
    "onnxsim==0.6.3",
    "opencv-python==4.13.0.92",
    "pgvector==0.4.2",
    "psycopg==3.3.4",
    "psycopg2==2.9.12",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.29",
    "sqlalchemy==2.0.50",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "uvicorn==0.48.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
